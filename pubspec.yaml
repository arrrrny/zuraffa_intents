name: zuraffa_intents
description: >-
  The incoming-share seam for the Zuraffa ecosystem: receive shared text/media
  (boot-time initial share plus a live stream) and record sent messages so
  share menus can suggest conversations. A TDD-built, wire-compatible
  replacement for zikzak_share_handler.
version: 1.0.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_intents
issue_tracker: https://github.com/arrrrny/zuraffa_intents/issues
topics:
  - share
  - share-intents
  - deep-links
  - plugins

environment:
  sdk: ^3.13.1
  flutter: ">=3.44.0"

flutter:
  plugin:
    platforms:
      android:
        package: dev.zuraffa.zuraffa_intents
        pluginClass: ZuraffaIntentsPlugin
      ios:
        pluginClass: ZuraffaIntentsPlugin
        podspec: ios/zuraffa_intents.podspec
      macos:
        pluginClass: ZuraffaIntentsPlugin
        podspec: macos/zuraffa_intents.podspec

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  get_it: ^9.2.1
  json_annotation: ^4.12.0
  zorphy_annotation: ^2.3.1
  zuraffa: ^6.1.0

dev_dependencies:
  build_runner: ^2.16.0
  coverage: ^1.15.1
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  lints: ^6.0.0
  mutation_test: ^1.8.0
