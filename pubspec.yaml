dev_dependencies:
  build_runner: ^2.16.0
  coverage: ^1.15.1
  json_serializable: ^6.14.1
  lints: ^6.0.0
  mutation_test: ^1.8.0
  test: ^1.25.6

dependency_overrides:
  analyzer: 14.1.0


