name: test

# Issue #4: the suite exercises platform-conditional logic
# (`defaultIsAppleLikeUriPath()` — true on macOS/iOS, false on Linux), so
# both lanes must run before each release. The `_isAppleLikeHost` helper
# in platform_interface_suite_test.dart makes the assertions portable.
on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --fatal-infos

      - name: flutter test
        run: flutter test

      - name: publish dry-run (no warnings)
        if: matrix.os == 'ubuntu-latest'
        run: flutter pub publish --dry-run
